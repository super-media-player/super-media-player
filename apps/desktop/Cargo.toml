[package]
name = "super-media-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "A media player for videos, music, internet streams and discs"

[[bin]]
name = "super-media-player"
path = "src/main.rs"

[dependencies]
player-core.workspace = true
log.workspace = true
slint = { version = "1.19.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
rfd = "0.18.0"
env_logger = "0.11.12"
raw-window-handle = "0.6"
libloading.workspace = true
# HTTPS downloads of yt-dlp and the Blu-ray key database (rustls, no OpenSSL).
ureq = "3.5.0"
# The Chromecast connection (the same TLS as ureq's).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
# MusicBrainz disc IDs of audio CDs.
sha1 = "0.11.0"
# Only reads zips (the key database), so no compressor.
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
lofty = "0.25.5"
# FLAC files of ripped CDs, from the exact samples (pure Rust).
flacenc = { version = "0.5.1", default-features = false }
# The phone remote's QR code (no image features: drawn into a Slint image).
qrcode = { version = "0.15", default-features = false }
serde_json = "1.0.154"
roxmltree = "0.21.2"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled", "cache"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
unicode-normalization = "0.1"

# MPRIS (media keys, desktop media controls) over D-Bus; pure Rust.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
# Administrator check and copied files on the clipboard (process.rs).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_UI_Shell"] }

[build-dependencies]
slint-build = "1.19.1"

[dev-dependencies]
# examples/render-views.rs draws the views offscreen to PNG files.
slint = { version = "1.19.1", features = ["software-renderer-systemfonts", "software-renderer-path"] }
png = "0.18.1"
