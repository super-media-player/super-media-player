<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- tile -->
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#232a4d"/>
      <stop offset="0.55" stop-color="#11152a"/>
      <stop offset="1" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- brand gradient: cyan to violet -->
    <linearGradient id="accent" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#4fe0ff"/>
      <stop offset="0.5" stop-color="#5c9dff"/>
      <stop offset="1" stop-color="#b06bff"/>
    </linearGradient>
    <linearGradient id="accent-soft" x1="0.9" y1="0.1" x2="0.1" y2="0.9">
      <stop offset="0" stop-color="#b06bff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4fe0ff" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5c9dff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7a6bff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7a6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile-clip"><rect x="12" y="12" width="232" height="232" rx="54"/></clipPath>
  </defs>

  <!-- tile with soft inner glow -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#tile)"/>
  <g clip-path="url(#tile-clip)">
    <circle cx="128" cy="132" r="118" fill="url(#glow)"/>
  </g>
  <rect x="13" y="13" width="230" height="230" rx="53" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- disc: outer ring, inner thin ring, a bright arc for motion -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="url(#accent)" stroke-width="13"/>
  <circle cx="128" cy="128" r="62" fill="none" stroke="url(#accent-soft)" stroke-width="2.5" stroke-opacity="0.7"/>
  <path d="M 70.6 72.9 A 80 80 0 0 1 128 48" fill="none" stroke="#ffffff" stroke-opacity="0.85"
        stroke-width="5" stroke-linecap="round" transform="rotate(-8 128 128)"/>

  <!-- play button -->
  <g filter="url(#shadow)">
    <path d="M112 94 Q106 90.5 106 97.5 L106 158.5 Q106 165.5 112 162 L162 133.5 Q168 128 162 122.5 Z"
          fill="url(#play)"/>
  </g>
</svg>
