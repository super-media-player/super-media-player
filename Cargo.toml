[workspace]
resolver = "3"
members = ["crates/mpv-sys", "crates/player-core", "apps/desktop"]

[workspace.package]
version = "0.68.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Dumitru Orlov"]
rust-version = "1.88"

[workspace.dependencies]
mpv-sys = { path = "crates/mpv-sys" }
player-core = { path = "crates/player-core" }
libloading = "0.8"
thiserror = "2"
log = "0.4"

# Ripping a CD encodes FLAC while reading: unoptimized, the encoder
# would be slower than the drive in debug builds and tests.
[profile.dev.package.flacenc]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
